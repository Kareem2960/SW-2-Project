server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /api/auth/v3/api-docs
        name: Auth Service
      - url: /api/projects/v3/api-docs
        name: Project Service
      - url: /api/tasks/v3/api-docs
        name: Task Service
      - url: /api/notifications/v3/api-docs
        name: Notification Service

jwt:
  secret: mySecretKey12345678901234567890123456789012
