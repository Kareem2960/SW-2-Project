server:
  port: 8083
  address: 0.0.0.0

spring:
  application:
    name: task-service
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=TaskFlow_Task;encrypt=false;trustServerCertificate=true
    username: sa
    password: YourStrong@Password123
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret: mySecretKey12345678901234567890123456789012

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Seeds tasks once when TaskFlow_Task is empty — project id 1 matches demo project seed
taskflow:
  demo:
    seed-enabled: true
    project-id: 1
    assign-user-id: 3
